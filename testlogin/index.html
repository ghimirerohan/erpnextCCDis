<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Test Login - User Display App</title>
    <meta name="description" content="Test app to display logged in user's full name" />
    <meta name="application-name" content="Test Login" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/testlogin/manifest.json" />
      <link rel="apple-touch-icon" href="/assets/custom_erp/frontend/icons/testlogin/icon-192x192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Store app name for future use (root-level paths)
      (function() {
        const currentPath = window.location.pathname;
        const match = currentPath.match(/^\/([^\/]+)/);
        if (match) {
          const appName = match[1];
          // Store app name for future use
          sessionStorage.setItem('lastApp', appName);
          localStorage.setItem('lastApp', appName);
        }
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
