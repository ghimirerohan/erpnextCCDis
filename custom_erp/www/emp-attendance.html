<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/custom_erp/frontend/emp-attendance/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Employee Attendance</title>
    <meta name="description" content="Employee Attendance Tracking and Management" />
    <meta name="application-name" content="Employee Attendance" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/api/method/custom_erp.api.pwa.get_manifest?app_name=emp-attendance" />
    <!-- Build output assets will be injected here by vite build -->
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function() {
        const currentPath = window.location.pathname;
        const match = currentPath.match(/^\/([^\/]+)/);
        if (match) {
          const appName = match[1];
          sessionStorage.setItem('lastApp', appName);
          localStorage.setItem('lastApp', appName);
        }
      })();
    </script>
    <script>
        {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
        {% endfor %}
    </script>
  </body>
</html>
