<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Employee Attendance</title>
    <meta name="description" content="Employee Attendance Tracking and Management" />
    <meta name="application-name" content="Employee Attendance" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/emp-attendance/manifest.json" />
      <link rel="apple-touch-icon" href="/assets/custom_erp/frontend/icons/emp-attendance/icon-192x192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Store app name for future use (root-level paths)
      (function() {
        const currentPath = window.location.pathname;
        const match = currentPath.match(/^\/([^\/]+)/);
        if (match) {
          const appName = match[1];
          sessionStorage.setItem('lastApp', appName);
          localStorage.setItem('lastApp', appName);
        }
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
